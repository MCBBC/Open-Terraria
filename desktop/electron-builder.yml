# SandboxWorld 桌面壳打包配置。
# 原则：只装壳（渲染器 + 主进程），游戏资源零打包（在线分片流式）。
# CI 断言安装器 <100MB —— scripts/check-size.mjs。

appId: com.vinlic.sandboxworld
productName: SandboxWorld
copyright: © 2026 vinlic

directories:
  output: release/${version}
  buildResources: build

# 源文件白名单：只带壳自身产物，排除一切 dev 依赖/sourcemap
files:
  - main.mjs
  - preload.cjs
  - package.json
  - "!**/*.map"
  - "!scripts/**"
  - "!launcher/**"
  - "!build/**"

# ★自包含政策(2026-08-29 用户定案)：游戏全量产物随包分发,缺省本地加载。
# 打包前必须先在 game/ 跑 `npm run build:release` 刷新 ../dist-release。
# 安装器体积因此从 ~71MB 涨到 ~430MB——100MB 红线由"壳红线"改记为
# "总包预算"(见 scripts/check-size.mjs 注释)。
extraResources:
  - from: ../dist-release
    to: dist
    filter:
      - "**/*"

asar: true

compression: maximum   # NSIS maximum；UPX 禁用（杀软误报），本配置不打 UPX

# 语言包裁剪：壳 UI 无语言面，仅保留中英
electronLanguages:
  - zh-CN
  - en-US

win:
  target:
    - target: nsis
      arch: [x64]
  # 未签名 SmartScreen 提示为已知项（正式期再议证书）

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: SandboxWorld-Setup-${version}.${ext}
  shortcutName: SandboxWorld

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.games
  artifactName: SandboxWorld-${version}-${arch}.${ext}
  # 公证（Gatekeeper 强制项）占位：正式发布时填入签名身份后启用 afterSign 钩子
  # hardenedRuntime: true
  # identity: "Developer ID Application: ...";

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Game
  artifactName: SandboxWorld-${version}-${arch}.${ext}
