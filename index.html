<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>SandboxWorld</title>
  <!-- PWA/主屏 web app 双端 meta:Android 用 manifest(display fullscreen + landscape
       由 WebAPK/TWA 遵守);iOS 不读 manifest 的 display/orientation,靠 apple-* meta
       进 standalone 并以 black-translucent 让状态栏融进画面(viewport-fit=cover
       已开安全区)。start_url=/ 与 SW 资产链 scope 一致。 -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a0c10" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SandboxWorld" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <script>
    // 非 IP/localhost 的 http 访问强制跳 https（安全上下文:SW/剪贴板/指针锁等
    // 需 https;局域网 IP 与 localhost 直连无证书场景不跳）。置于最前,任何
    // API 调用先于模块加载执行。
    (function () {
      try {
        if (location.protocol !== 'http:') return;
        var h = location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h === '::1' || h === '[::1]') return;
        if (/^\d{1,3}(\.\d{1,3}){3}$/.test(h)) return;          // IPv4(含局域网)
        if (h.indexOf(':') !== -1) return;                        // 裸 IPv6
        location.replace('https://' + location.host + location.pathname + location.search + location.hash);
      } catch (e) { /* 环境异常不阻断加载 */ }
    })();
  </script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
      overscroll-behavior: none; /* 防触摸橡皮筋/下拉刷新(菜单列表自身滚动不受影响) */
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    /* touch-action 不设在 #game-root:touch-action 沿祖先链取交集会连带禁掉
       菜单面板(.sw-vsel-list/.sw-cc-hairgrid)的原生触摸滚动。世界区触摸手势
       由 canvas 自身的 touch-action:none + Input.ts(canvas 监听)preventDefault
       双保险禁用——若把 Input 监听迁到 root,须同步在此恢复 none。 */
    #game-root { position: fixed; inset: 0; }
    canvas { display: block; image-rendering: pixelated; touch-action: none; }
    /* ★首屏静态读条(2026-09-20 用户要求):零 JS 纯 CSS——bundle(主包 MB 级)下载
       解析完成前 index.html 落地即显示,消灭「黑屏像卡住」窗口。动画=steps() 离散
       跳变模拟像素步进;JS 侧启动幕(#sw-boot-prime)挂载/bypass 路径时摘除
       (main.ts removeStaticBoot),摘除时机晚于本层=覆盖无缝交接。z=9998:
       启动幕 10000 之下、音频门 10001 之下、页面其余一切之上。 */
    #sw-boot-static { position: fixed; inset: 0; z-index: 9998; background: #000;
      display: flex; align-items: center; justify-content: center; }
    #sw-boot-static .sb-bar { width: 192px; height: 16px; border: 2px solid #7d92d6;
      background-color: #0a0e20;
      background-image: repeating-linear-gradient(45deg,
        #59c8ff 0, #59c8ff 4px, transparent 4px, transparent 16px);
      background-size: 22.6274px 100%;
      animation: sb-march .48s steps(4) infinite; }
    @keyframes sb-march { to { background-position: 22.6274px 0; } }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="sw-boot-static"><div class="sb-bar"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
