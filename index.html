<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>SandboxWorld</title>
  <script>
    // 非 IP/localhost 的 http 访问强制跳 https（安全上下文:SW/剪贴板/指针锁等
    // 需 https;局域网 IP 与 localhost 直连无证书场景不跳）。置于最前,任何
    // API 调用先于模块加载执行。
    (function () {
      try {
        if (location.protocol !== 'http:') return;
        var h = location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h === '::1' || h === '[::1]') return;
        if (/^\d{1,3}(\.\d{1,3}){3}$/.test(h)) return;          // IPv4(含局域网)
        if (h.indexOf(':') !== -1) return;                        // 裸 IPv6
        location.replace('https://' + location.host + location.pathname + location.search + location.hash);
      } catch (e) { /* 环境异常不阻断加载 */ }
    })();
  </script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
      overscroll-behavior: none; /* 防触摸橡皮筋/下拉刷新(菜单列表自身滚动不受影响) */
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    /* touch-action 不设在 #game-root:touch-action 沿祖先链取交集会连带禁掉
       菜单面板(.sw-vsel-list/.sw-cc-hairgrid)的原生触摸滚动。世界区触摸手势
       由 canvas 自身的 touch-action:none + Input.ts(canvas 监听)preventDefault
       双保险禁用——若把 Input 监听迁到 root,须同步在此恢复 none。 */
    #game-root { position: fixed; inset: 0; }
    canvas { display: block; image-rendering: pixelated; touch-action: none; }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
