<!DOCTYPE html><html><body><canvas id="c" width="54" height="392"></canvas>
<script>
const img = new Image();
img.onload = () => {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,54,392);
  ctx.drawImage(img, 0, 0);
  const id = ctx.getImageData(0,0,54,392);
  const results = [];
  for (let band = 0; band < 7; band++) {
    const y0 = band * 56;
    const rows = [];
    for (let dy = 0; dy < Math.min(56, 392 - y0); dy++) {
      const y = y0 + dy;
      const row = { opaque: 0, cols: {} };
      for (let x = 0; x < 54; x++) {
        const o = (y * 54 + x) * 4;
        if (id.data[o+3] > 64) { row.opaque++; row.cols[Math.floor(x/18)] = (row.cols[Math.floor(x/18)]||0)+1; }
      }
      rows.push(row);
    }
    const totalOpq = rows.reduce((a,r)=>a+r.opaque,0);
    const colTotals = {};
    rows.forEach(r=>{for(const[k,v]of Object.entries(r.cols))colTotals[k]=(colTotals[k]||0)+v;});
    results.push({band,y0,opaquePx:totalOpq,colsBy18:colTotals,
      top3rows:rows.slice(0,3).map(r=>r.opaque),
      bottom3rows:rows.slice(-3).map(r=>r.opaque)});
  }
  document.title = JSON.stringify(results);
};
img.src = '/sprites/vanilla/Tiles_406.png';
</script></body></html>
