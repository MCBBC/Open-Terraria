const CELL = 16;
const imgs = {};
const load = (src) => imgs[src] ?? (imgs[src] = (() => { const i = new Image(); i.src = src; return i; })());
// 网格化
const G = Array.from({ length: DATA.h }, () => Array(DATA.w).fill(null));
for (const c of DATA.cells) G[c.y - DATA.y0][c.x - DATA.x0] = c;
const at = (x, y) => (x < 0 || y < 0 || x >= DATA.w || y >= DATA.h) ? null : G[y][x];
const solid = c => c && c.s > 0 && c.f;
const lqd = c => c && c.lq > 0;
const isStoneFam = s => s === 0 || s === 1 || s === 2;   // sheet 0-2 石族互认
const sameFam = (a, b) => !a || !b ? false : (a.s >= 0 && b.s >= 0 && (a.s === b.s || (isStoneFam(a.s) && isStoneFam(b.s))));
// 分类(同上一版)
function classify(c, x, y) {
  const W = { L: lqd(at(x-1,y)), R: lqd(at(x+1,y)), U: lqd(at(x,y-1)), D: lqd(at(x,y+1)) };
  if (!(W.L || W.R || W.U || W.D)) return null;
  const C = { L: sameFam(at(x-1,y), c), R: sameFam(at(x+1,y), c), U: sameFam(at(x,y-1), c), D: sameFam(at(x,y+1), c) };
  let openCorner = false;
  for (const [hx, vy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
    const H = hx < 0 ? [C.L, W.L] : [C.R, W.R];
    const V = vy < 0 ? [C.U, W.U] : [C.D, W.D];
    if (!H[0] && !V[0] && (H[1] || V[1])) openCorner = true;
  }
  return { W, C, kind: openCorner ? 'corner' : 'straight' };
}
let zoom = 2, showLq = true, showBand = true, showMark = true;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
function render() {
  const S = CELL * zoom;
  cv.width = DATA.w * S; cv.height = DATA.h * S;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < DATA.h; y++) for (let x = 0; x < DATA.w; x++) {
    const c = G[y][x]; if (!c) continue;
    const px = x * S, py = y * S;
    // 墙
    if (c.wl > 0 && WALLS[String(c.wl)]) {
      const wm = WALLS[String(c.wl)];
      const img = load(wm.file);
      if (img.complete && img.naturalWidth) {
        ctx.globalAlpha = 0.55;
        ctx.drawImage(img, 0, 0, wm.grid[0], wm.grid[1], px, py, S, S);
        ctx.globalAlpha = 1;
      } else { ctx.fillStyle = 'rgba(40,46,66,.6)'; ctx.fillRect(px, py, S, S); }
    }
    // 浸润带(画在方块"后"=先画带再画贴图,贴图透明处透出)
    const cls = solid(c) ? classify(c, x, y) : null;
    if (showBand && cls && solid(c)) {
      const liqN = cls.W;
      ctx.fillStyle = 'rgba(52,132,225,1)';
      if (liqN.U) ctx.fillRect(px, py, S, Math.max(2, S * 4 / 16));
      if (liqN.D && (liqN.L || liqN.R)) { ctx.fillRect(px, py, S, S); }
      else if (liqN.D) ctx.fillRect(px, py + S - Math.max(2, S * 4 / 16), S, Math.max(2, S * 4 / 16));
      if (liqN.L) ctx.fillRect(px, py, Math.max(2, S * 4 / 16), S);
      if (liqN.R) ctx.fillRect(px + S - Math.max(2, S * 4 / 16), py, Math.max(2, S * 4 / 16), S);
    }
    // 固体贴图(真实帧)
    if (solid(c) && SHEETS[String(c.s)]) {
      const sm = SHEETS[String(c.s)];
      const img = load(sm.file);
      if (img.complete && img.naturalWidth) {
        ctx.drawImage(img, c.f[0] * sm.stride[0], c.f[1] * sm.stride[1], sm.grid[0], sm.grid[1], px, py, S, S);
      } else { ctx.fillStyle = '#6a7a9a'; ctx.fillRect(px, py, S, S); }
    }
    // 液体(高度=液位,水色半透+顶线)
    if (showLq && lqd(c)) {
      const hgt = Math.max(2, Math.round(c.lq / 255 * S));
      ctx.fillStyle = 'rgba(52,132,225,.55)';
      ctx.fillRect(px, py + S - hgt, S, hgt);
      ctx.fillStyle = 'rgba(150,205,255,.8)';
      ctx.fillRect(px, py + S - hgt, S, 1);
    }
    // 分类标注
    if (showMark && cls) {
      ctx.strokeStyle = cls.kind === 'corner' ? '#ffb84d' : '#ff5555';
      ctx.lineWidth = Math.max(1, zoom);
      ctx.strokeRect(px + 1, py + 1, S - 2, S - 2);
    }
  }
  // 玩家
  const pxx = (3485 - DATA.x0) * S, pyy = (322 - DATA.y0) * S;
  ctx.strokeStyle = '#7dff9a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(pxx + S / 2, pyy + S / 2, S * 0.8, 0, 7); ctx.stroke();
  requestAnimationFrame(() => render2());
}

let loadedN = 0;

}
const tip = document.getElementById('tip');
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / (CELL * zoom)), y = Math.floor((e.clientY - r.top) / (CELL * zoom));

  tip.innerHTML = `坐标: (${DATA.x0 + x}, ${DATA.y0 + y})\n` +
    (c ? `sheet=${c.s} 帧=${c.f ?? '—'} 墙=${c.wl} 液=${c.lq}` : '空') +
    (cls ? `\n<b class="${cls.kind === 'corner' ? 'sus' : 'same'}">${cls.kind === 'corner' ? '端点/角——应透水(无水色=真bug)' : '直边——原版同款不透水'}</b>\n水邻: ${Object.entries(cls.W).filter(([,v])=>v).map(([k])=>k).join(',')}` : '');
});
cv.addEventListener('click', async e => {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / (CELL * zoom)), y = Math.floor((e.clientY - r.top) / (CELL * zoom));
  try { await navigator.clipboard.writeText(`(${DATA.x0 + x}, ${DATA.y0 + y})`); tip.innerHTML += '\n✓ 已复制坐标'; } catch {}
});
// 用户标注
  const FLAGGED = [[3504, 325], [3486, 325]];
  for (const [fx, fy] of FLAGGED) {
    const px2 = (fx - DATA.x0) * CELL * zoom, py2 = (fy - DATA.y0) * CELL * zoom;

    ctx.fillText(`(${fx},${fy})`, px2 + CELL * zoom + 6, py2 + 14);
