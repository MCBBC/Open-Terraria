<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贴图表探查</title>
<style>
  body { margin:0; background:#1a1626; color:#e8e4f0; font-family:monospace; }
  #toolbar { position:fixed; top:0; left:0; right:0; background:#241e38; padding:8px 12px;
    display:flex; gap:8px; align-items:center; z-index:10; border-bottom:2px solid #4a3a6a; flex-wrap:wrap; }
  input[type=number], select { background:#141020; color:#fff; border:1px solid #6a5a8a; border-radius:4px; padding:4px 6px; }
  button { padding:6px 12px; border-radius:5px; border:1px solid #6a5a8a; background:#3a2f52; color:#fff; cursor:pointer; }
  button:hover { background:#4a3f66; }
  #wrap { padding:60px 12px 12px; overflow:auto; }
  #stage { position:relative; display:inline-block; cursor:crosshair; }
  #img { image-rendering:pixelated; display:block; }
  #gridOv, #boxes { position:absolute; inset:0; pointer-events:none; }
  .info { font-size:12px; color:#9fb0dd; }
  #out { position:fixed; right:12px; top:56px; background:#141020; border:2px solid #4a3a6a;
    border-radius:6px; padding:8px 10px; font-size:11px; max-width:320px; white-space:pre; z-index:20; }
</style>
</head>
<body>
<div id="toolbar">
  <b>贴图表探查</b>
  <label class="info">表 id <input type="number" id="sheetId" value="187" min="0" max="800" style="width:64px"></label>
  <label class="info">网格 <input type="number" id="gw" value="16" style="width:52px"> × <input type="number" id="gh" value="16" style="width:52px"></label>
  <label class="info">步长 <input type="number" id="sx" value="18" style="width:52px"> × <input type="number" id="sy" value="18" style="width:52px"></label>
  <label class="info">缩放 <select id="zoom"><option>1</option><option selected>2</option><option>4</option><option>8</option></select></label>
  <button onclick="loadSheet()">加载</button>
  <span class="info" id="dims"></span>
  <span class="info">拖拽画矩形标记内容区 → 右侧输出像素/网格坐标</span>
</div>
<div id="wrap"><div id="stage">
  <img id="img" alt="">
  <canvas id="gridOv"></canvas>
  <canvas id="boxes"></canvas>
</div></div>
<div id="out">拖拽标记</div>
<script>
const params = new URLSearchParams(location.search);
if (params.get('sheet')) document.getElementById('sheetId').value = params.get('sheet');
if (params.get('grid')) { const [a, b] = params.get('grid').split('x'); document.getElementById('gw').value = a; document.getElementById('gh').value = b; }
if (params.get('stride')) { const [a, b] = params.get('stride').split('x'); document.getElementById('sx').value = a; document.getElementById('sy').value = b; }

const img = document.getElementById('img');
const stage = document.getElementById('stage');
const boxes = document.getElementById('boxes');
const bctx = boxes.getContext('2d');
let scale = 2, marks = [];

function loadSheet() {
  const id = document.getElementById('sheetId').value;
  scale = Number(document.getElementById('zoom').value);
  img.src = `sprites/vanilla/Tiles_${id}.png`;
}
img.onload = () => {
  scale = Number(document.getElementById('zoom').value);
  img.style.width = (img.naturalWidth * scale) + 'px';
  img.style.height = (img.naturalHeight * scale) + 'px';
  document.getElementById('dims').textContent =
    `原始 ${img.naturalWidth}×${img.naturalHeight}px`;
  for (const c of [document.getElementById('gridOv'), boxes]) {
    c.width = img.naturalWidth * scale; c.height = img.naturalHeight * scale;
  }
  const g = document.getElementById('gridOv').getContext('2d');
  const gx = Number(document.getElementById('sx').value), gy = Number(document.getElementById('sy').value);
  g.strokeStyle = 'rgba(160,180,255,0.25)'; g.lineWidth = 1;
  for (let x = 0; x <= img.naturalWidth; x += gx) {
    g.beginPath(); g.moveTo(x * scale + .5, 0); g.lineTo(x * scale + .5, c.height); g.stroke();
  }
  for (let y = 0; y <= img.naturalHeight; y += gy) {
    g.beginPath(); g.moveTo(0, y * scale + .5); g.lineTo(c.width, y * scale + .5); g.stroke();
  }
  redraw();
};

let dragStart = null;
stage.addEventListener('mousedown', (e) => {
  const r = img.getBoundingClientRect();
  dragStart = { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  e.preventDefault();
});
window.addEventListener('mousemove', (e) => {
  if (!dragStart) return;
  const r = img.getBoundingClientRect();
  const cur = { x: Math.max(0, (e.clientX - r.left) / scale), y: Math.max(0, (e.clientY - r.top) / scale) };
  redraw(dragStart, cur);
});
window.addEventListener('mouseup', (e) => {
  if (!dragStart) return;
  const r = img.getBoundingClientRect();
  const cur = { x: Math.max(0, (e.clientX - r.left) / scale), y: Math.max(0, (e.clientY - r.top) / scale) };
  const x0 = Math.round(Math.min(dragStart.x, cur.x)), y0 = Math.round(Math.min(dragStart.y, cur.y));
  const x1 = Math.round(Math.max(dragStart.x, cur.x)), y1 = Math.round(Math.max(dragStart.y, cur.y));
  if (x1 - x0 > 2 && y1 - y0 > 2) {
    marks.push({ x0, y0, x1, y1 });
    renderOut();
  }
  dragStart = null;
  redraw();
});

function redraw(a, b) {
  const gx = Number(document.getElementById('sx').value), gy = Number(document.getElementById('sy').value);
  bctx.clearRect(0, 0, boxes.width, boxes.height);
  bctx.strokeStyle = '#40FF80'; bctx.lineWidth = 2;
  for (const m of marks) bctx.strokeRect(m.x0 * scale, m.y0 * scale, (m.x1 - m.x0) * scale, (m.y1 - m.y0) * scale);
  if (a && b) {
    bctx.strokeStyle = '#FFD75A';
    bctx.strokeRect(Math.min(a.x, b.x) * scale, Math.min(a.y, b.y) * scale,
      Math.abs(b.x - a.x) * scale, Math.abs(b.y - a.y) * scale);
  }
}

function renderOut() {
  const gx = Number(document.getElementById('sx').value), gy = Number(document.getElementById('sy').value);
  const lines = marks.map((m, i) => {
    const c0 = Math.floor(m.x0 / gx), r0 = Math.floor(m.y0 / gy);
    const c1 = Math.ceil(m.x1 / gx) - 1, r1 = Math.ceil(m.y1 / gy) - 1;
    return `#${i + 1} 像素(${m.x0},${m.y0})-(${m.x1},${m.y1})\n    网格 col ${c0}-${c1} row ${r0}-${r1}\n    frameOffset = (${c0 * gx}, ${r0 * gy})`;
  });
  document.getElementById('out').textContent = lines.join('\n') || '拖拽标记';
  console.log('marks JSON:', JSON.stringify(marks));
}

loadSheet();
</script>
</body>
</html>
