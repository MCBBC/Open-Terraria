<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>碰撞盒校准 — 贴图直排</title>
<style>
  body { margin:0; background:#111; color:#dde; font:13px monospace; display:flex; flex-direction:column; height:100vh; }
  #toolbar { padding:8px 12px; background:#1a1a2e; border-bottom:1px solid #333; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #toolbar label { color:#8a90b8; font-size:11px; }
  select, input { background:#222; color:#fff; border:1px solid #555; font:11px monospace; padding:3px 6px; border-radius:3px; }
  button { background:#2a3a6e; color:#dde; border:1px solid #4a6ace; border-radius:4px; padding:4px 10px; cursor:pointer; font:11px monospace; }
  button:hover { background:#3a4a8e; }
  #canvas-wrap { flex:1; overflow:auto; position:relative; background:
    repeating-conic-gradient(#1a1a1a 0% 25%, #151515 0% 50%) 50% / 32px 32px; }
  canvas { image-rendering:pixelated; position:absolute; left:50%; top:20px; transform:translateX(-50%); cursor:crosshair; }
  #output { position:fixed; bottom:0; left:0; right:0; background:#1a1a2e; border-top:1px solid #333;
    padding:6px 12px; font:11px monospace; max-height:150px; overflow:auto; white-space:pre; color:#7dff9a; display:none; z-index:10; }
  #info { position:fixed; top:50px; right:12px; background:rgba(0,0,0,.85); border:1px solid #445;
    border-radius:6px; padding:8px; font:11px monospace; min-width:200px; z-index:10; pointer-events:none; }
  #search-drop { position:absolute; top:34px; left:0; background:#1a1a2e; border:1px solid #556;
    border-radius:4px; max-height:260px; overflow:auto; display:none; z-index:20; min-width:240px; }
  #search-drop .opt { padding:4px 10px; cursor:pointer; white-space:nowrap; }
  #search-drop .opt:hover, #search-drop .opt.active { background:#2a3a6e; }
  #toolbar { position:relative; }
</style>
</head>
<body>
<div id="toolbar">
  <label>类别:</label>
  <select id="category">
    <option value="projectile">投射物 Projectile_N</option>
    <option value="npc">NPC_N</option>
    <option value="item">物品 Item_N</option>
  </select>
  <label>ID:</label>
  <input id="sheetId" type="number" value="28" min="0" max="1000" style="width:60px">
  <button id="load">加载贴图</button>
  <label>搜索名称:</label>
  <input id="search" type="text" placeholder="中文名 / 英文名 / id,如 炸弹" style="width:160px" autocomplete="off">
  <div id="search-drop"></div>
  <button id="grid">网格 16px</button>
  <button id="dump">导出 JSON</button>
  <span id="dims" style="color:#ffd76e"></span>
</div>
<div id="canvas-wrap"><canvas id="cv"></canvas></div>
<div id="info"></div>
<div id="output"></div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const infoEl = document.getElementById('info');
const outputEl = document.getElementById('output');

let img = null;
let showGrid = false;
let SCALE = 3; // 放大倍数
// 碰撞盒: 贴图像素坐标系(1x)
let box = { x: 0, y: 0, w: 22, h: 22 };
// 拖动状态
let dragMode = null; // 'move' | 'nw' | 'ne' | 'sw' | 'se'
let dragStart = null;
let boxes = {}; // sheetId -> {x,y,w,h}
// 名称索引: category -> { id: {en, zh} }（public/hitbox-names.json,由
// src/i18n/idNames.generated.ts + l10n ProjectileName/NPCName/ItemName 生成）
let NAMES = null;
let dropIdx = -1;

fetch('hitbox-names.json').then(r => r.json()).then(d => { NAMES = d; loadImage(); }).catch(() => {});

function nameOf(cat, id) {
  return NAMES?.[cat]?.[id] ?? null;
}

function loadImage() {
  const cat = document.getElementById('category').value;
  const id = document.getElementById('sheetId').value;
  const prefix = cat === 'projectile' ? 'Projectile' : cat === 'npc' ? 'NPC' : 'Item';
  const src = `sprites/vanilla/${prefix}_${id}.png`;
  img = new Image();
  img.onload = () => {
    const w = img.naturalWidth, h = img.naturalHeight;
    cv.width = w * SCALE + 80;
    cv.height = h * SCALE + 80;
    cv.style.width = cv.width + 'px';
    cv.style.height = cv.height + 'px';
    // 恢复已存标注或默认
    const saved = boxes[cat + '_' + id];
    if (saved) box = { ...saved };
    else {
      // 默认:居中正方形
      const s = Math.min(w, h);
      box = { x: (w - s) / 2, y: (h - s) / 2, w: s, h: s };
    }
    const nm = nameOf(cat, id);
    document.getElementById('dims').textContent =
      `${prefix}_${id}: ${w}×${h}px` + (nm ? `  ${nm.zh || nm.en} (${nm.en})` : '');
    render();
  };
  img.onerror = () => { document.getElementById('dims').textContent = `${prefix}_${id}: 加载失败`; };
  img.src = src;
}

function render() {
  if (!img || !img.naturalWidth) return;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const ox = 40, oy = 40;
  // 贴图
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, ox, oy, img.naturalWidth * SCALE, img.naturalHeight * SCALE);
  // 网格
  if (showGrid) {
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= img.naturalWidth; x += 16) {
      ctx.beginPath(); ctx.moveTo(ox + x*SCALE, oy); ctx.lineTo(ox + x*SCALE, oy + img.naturalHeight*SCALE); ctx.stroke();
    }
    for (let y = 0; y <= img.naturalHeight; y += 16) {
      ctx.beginPath(); ctx.moveTo(ox, oy + y*SCALE); ctx.lineTo(ox + img.naturalWidth*SCALE, oy + y*SCALE); ctx.stroke();
    }
  }
  // 碰撞盒(绿色半透 + 实线框)
  const bx = ox + box.x * SCALE, by = oy + box.y * SCALE;
  const bw = box.w * SCALE, bh = box.h * SCALE;
  ctx.fillStyle = 'rgba(0,255,100,0.12)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = '#00FF66';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);
  // 四角拖动点
  ctx.fillStyle = '#00FF66';
  for (const [cx, cy] of [[bx,by],[bx+bw,by],[bx,by+bh],[bx+bw,by+bh]]) {
    ctx.fillRect(cx-5, cy-5, 10, 10);
  }
  // 中心十字
  const ccx = bx + bw/2, ccy = by + bh/2;
  ctx.strokeStyle = '#FF6600'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ccx-8,ccy); ctx.lineTo(ccx+8,ccy); ctx.moveTo(ccx,ccy-8); ctx.lineTo(ccx,ccy+8); ctx.stroke();
  // 标注
  ctx.font = 'bold 12px monospace';
  ctx.fillStyle = '#00FF66';
  ctx.fillText(`box: x=${box.x} y=${box.y} w=${box.w} h=${box.h}`, bx, by - 6);
  ctx.fillStyle = '#FF6600';
  ctx.fillText(`center offset from sprite: (${box.x + box.w/2 - img.naturalWidth/2}, ${box.y + box.h/2 - img.naturalHeight/2})`, bx, by + bh + 16);
}

// 鼠标交互
function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / SCALE - 40 / SCALE, y: (e.clientY - r.top) / SCALE - 40 / SCALE };
}
function hitTest(p) {
  const bx = box.x, by = box.y, bw = box.w, bh = box.h;
  const m = 3; // 边距
  if (Math.abs(p.x - bx) < m && Math.abs(p.y - by) < m) return 'nw';
  if (Math.abs(p.x - bx - bw) < m && Math.abs(p.y - by) < m) return 'ne';
  if (Math.abs(p.x - bx) < m && Math.abs(p.y - by - bh) < m) return 'sw';
  if (Math.abs(p.x - bx - bw) < m && Math.abs(p.y - by - bh) < m) return 'se';
  if (p.x >= bx && p.x <= bx + bw && p.y >= by && p.y <= by + bh) return 'move';
  return null;
}
cv.addEventListener('mousedown', (e) => {
  const p = getPos(e);
  const hit = hitTest(p);
  if (hit) { dragMode = hit; dragStart = { ...p, box: { ...box } }; e.preventDefault(); }
});
window.addEventListener('mousemove', (e) => {
  const p = getPos(e);
  if (dragMode) {
    const dx = p.x - dragStart.x, dy = p.y - dragStart.y;
    const b0 = dragStart.box;
    if (dragMode === 'move') {
      box.x = Math.round(b0.x + dx);
      box.y = Math.round(b0.y + dy);
    } else {
      if (dragMode.includes('n')) { box.y = Math.round(b0.y + dy); box.h = Math.round(b0.h - dy); }
      if (dragMode.includes('s')) { box.h = Math.round(b0.h + dy); }
      if (dragMode.includes('w')) { box.x = Math.round(b0.x + dx); box.w = Math.round(b0.w - dx); }
      if (dragMode.includes('e')) { box.w = Math.round(b0.w + dx); }
      if (box.w < 1) box.w = 1; if (box.h < 1) box.h = 1;
    }
    render();
  } else {
    const hit = hitTest(p);
    cv.style.cursor = hit === 'move' ? 'move'
      : hit === 'nw' || hit === 'se' ? 'nwse-resize'
      : hit === 'ne' || hit === 'sw' ? 'nesw-resize' : 'crosshair';
  }
  // 悬停信息
  if (img) {
    infoEl.innerHTML = `鼠标:贴图坐标 (${Math.round(p.x)}, ${Math.round(p.y)})\n` +
      `盒: x=${box.x} y=${box.y} w=${box.w} h=${box.h}\n` +
      `中心偏移: (${box.x + box.w/2 - img.naturalWidth/2}, ${box.y + box.h/2 - img.naturalHeight/2})`;
  }
});
window.addEventListener('mouseup', () => {
  if (dragMode) {
    dragMode = null;
    // 保存标注
    const cat = document.getElementById('category').value;
    const id = document.getElementById('sheetId').value;
    boxes[cat + '_' + id] = { ...box };
  }
});

// 工具栏
document.getElementById('load').onclick = loadImage;
document.getElementById('sheetId').onchange = loadImage;
document.getElementById('category').onchange = loadImage;
document.getElementById('grid').onclick = () => { showGrid = !showGrid; render(); };

// 名称搜索：中文/英文/id 前缀匹配，↑↓ 选择，Enter/点击加载
const searchEl = document.getElementById('search');
const dropEl = document.getElementById('search-drop');
let dropItems = [];

function doSearch() {
  const q = searchEl.value.trim().toLowerCase();
  dropEl.innerHTML = ''; dropItems = []; dropIdx = -1;
  if (!q || !NAMES) { dropEl.style.display = 'none'; return; }
  const cat = document.getElementById('category').value;
  const table = NAMES[cat] ?? {};
  const hits = [];
  for (const [id, nm] of Object.entries(table)) {
    const zh = (nm.zh || '').toLowerCase(), en = (nm.en || '').toLowerCase();
    if (zh.startsWith(q) || en.startsWith(q) || id === q) hits.push({ id, ...nm });
    if (hits.length >= 60) break;
  }
  if (!hits.length) { dropEl.style.display = 'none'; return; }
  dropItems = hits;
  for (const h of hits) {
    const div = document.createElement('div');
    div.className = 'opt';
    div.textContent = `${h.id}  ${h.zh || ''} ${h.zh && h.en ? '/ ' + h.en : h.en}`;
    div.onclick = () => pickHit(h.id);
    dropEl.appendChild(div);
  }
  dropEl.style.display = 'block';
}
function pickHit(id) {
  document.getElementById('sheetId').value = id;
  dropEl.style.display = 'none';
  searchEl.value = '';
  loadImage();
}
function moveDrop(d) {
  const opts = dropEl.querySelectorAll('.opt');
  if (!opts.length) return;
  dropIdx = Math.max(0, Math.min(opts.length - 1, dropIdx + d));
  opts.forEach((o, i) => o.classList.toggle('active', i === dropIdx));
  opts[dropIdx].scrollIntoView({ block: 'nearest' });
}
searchEl.addEventListener('input', doSearch);
searchEl.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { moveDrop(1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { moveDrop(-1); e.preventDefault(); }
  else if (e.key === 'Enter') {
    const pick = dropItems[dropIdx >= 0 ? dropIdx : 0];
    if (pick) { pickHit(pick.id); e.preventDefault(); }
  } else if (e.key === 'Escape') dropEl.style.display = 'none';
});
document.addEventListener('click', (e) => {
  if (!dropEl.contains(e.target) && e.target !== searchEl) dropEl.style.display = 'none';
});
document.getElementById('dump').onclick = () => {
  const result = {};
  for (const [key, val] of Object.entries(boxes)) {
    const [cat, id] = key.split('_');
    result[cat] = result[cat] || {};
    result[cat][id] = val;
  }
  const json = JSON.stringify(result, null, 2);
  outputEl.style.display = 'block';
  outputEl.textContent = json;
  navigator.clipboard?.writeText(json).then(() => {
    outputEl.textContent += '\n\n✓ 已复制到剪贴板';
  }).catch(() => {});
};

// 键盘微调（输入框聚焦时让位——搜索框方向键用于选候选）
window.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
  const step = e.shiftKey ? 5 : 1;
  switch (e.key) {
    case 'ArrowUp': box.y -= step; break;
    case 'ArrowDown': box.y += step; break;
    case 'ArrowLeft': box.x -= step; break;
    case 'ArrowRight': box.x += step; break;
    case '+': case '=': SCALE = Math.min(10, SCALE + 1); cv.width = img.naturalWidth*SCALE+80; cv.height = img.naturalHeight*SCALE+80; cv.style.width = cv.width+'px'; cv.style.height = cv.height+'px'; break;
    case '-': SCALE = Math.max(1, SCALE - 1); cv.width = img.naturalWidth*SCALE+80; cv.height = img.naturalHeight*SCALE+80; cv.style.width = cv.width+'px'; cv.style.height = cv.height+'px'; break;
    default: return;
  }
  e.preventDefault();
  render();
});

loadImage();
</script>
</body>
</html>
