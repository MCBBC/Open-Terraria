<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>素材重制工作台 · Remaster Studio</title>
<style>
  :root {
    --bg: #14101f; --panel: #1c1730; --panel2: #241e3c; --line: #3a2f5e;
    --txt: #e8e4f0; --dim: #9a8ec0; --acc: #7d92d6; --gold: #ffd76e;
    --st-untouched: #55506a; --st-pending: #5a9cf0; --st-accepted: #4ad07a; --st-skipped: #e0c050;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font: 13px/1.5 "Fusion Pixel 12px", "Microsoft YaHei", monospace; overflow: hidden; }
  button { padding: 5px 12px; border-radius: 4px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--txt); cursor: pointer; font: inherit; }
  button:hover { border-color: var(--acc); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #3a2f6e; border-color: var(--acc); }
  button.good { border-color: var(--st-accepted); color: var(--st-accepted); }
  input, select, textarea { background: #100c1c; color: var(--txt); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 8px; font: inherit; }
  canvas { image-rendering: pixelated; }
  #topbar { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: var(--panel); border-bottom: 2px solid var(--line); }
  #topbar b { color: var(--gold); letter-spacing: 2px; }
  #topbar .spacer { flex: 1; }
  #status { color: var(--dim); font-size: 12px; }
  #main { display: flex; height: calc(100% - 46px); }
  /* 左栏 */
  #left { width: 264px; flex: none; display: flex; flex-direction: column;
    background: var(--panel); border-right: 2px solid var(--line); }
  #cats { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
  #cats button { padding: 3px 8px; font-size: 12px; }
  #cats button.on { background: #3a2f6e; border-color: var(--acc); color: var(--gold); }
  #left .search { padding: 8px; display: flex; gap: 6px; }
  #left .search input { flex: 1; }
  #list { flex: 1; overflow-y: auto; }
  .item { padding: 5px 10px; cursor: pointer; border-bottom: 1px solid #241e3c; display: flex;
    align-items: center; gap: 6px; }
  .item:hover { background: var(--panel2); }
  .item.sel { background: #322a56; border-left: 3px solid var(--acc); }
  .item.excl { opacity: .38; }
  .item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .pg { font-size: 11px; color: var(--dim); }
  .item .pg.done { color: var(--st-accepted); }
  #left .foot { padding: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  /* 中栏 */
  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #sheetwrap { flex: 1; overflow: auto; background:
      repeating-conic-gradient(#181228 0% 25%, #131020 0% 50%) 0 0 / 24px 24px; position: relative; }
  #sheetwrap .inner { position: relative; display: inline-block; margin: 12px; }
  #sheetcv { display: block; background:
      repeating-conic-gradient(#221a38 0% 25%, #1a1428 0% 50%) 0 0 / 16px 16px; }
  #gridov { position: absolute; inset: 0; pointer-events: none; }
  #filmstrip { height: 86px; flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 8px;
    background: var(--panel); border-top: 2px solid var(--line); align-items: center; }
  .film { flex: none; width: 62px; cursor: pointer; text-align: center; }
  .film canvas { width: 48px; height: 48px; background:
    repeating-conic-gradient(#221a38 0% 25%, #1a1428 0% 50%) 0 0 / 12px 12px; border: 2px solid var(--st-untouched); }
  .film.sel canvas { border-color: var(--gold); }
  .film[data-st="pending"] canvas { border-color: var(--st-pending); }
  .film[data-st="accepted"] canvas { border-color: var(--st-accepted); }
  .film[data-st="skipped"] canvas { border-color: var(--st-skipped); }
  .film .idx { font-size: 10px; color: var(--dim); }
  /* 右栏 */
  #right { width: 392px; flex: none; overflow-y: auto; padding: 12px;
    background: var(--panel); border-left: 2px solid var(--line); }
  #right h3 { margin: 2px 0 8px; color: var(--gold); font-size: 14px; }
  #right .meta { color: var(--dim); font-size: 11px; margin-bottom: 10px; word-break: break-all; }
  #compare { display: flex; gap: 10px; margin-bottom: 8px; }
  #compare .cell { flex: 1; text-align: center; }
  #compare .cell canvas { width: 100%; background:
    repeating-conic-gradient(#221a38 0% 25%, #1a1428 0% 50%) 0 0 / 16px 16px; border: 1px solid var(--line); }
  #compare .cell .lb { font-size: 11px; color: var(--dim); }
  #genpreview { width: 100%; margin: 6px 0; border: 1px dashed var(--line); display: none; }
  #prompt { width: 100%; height: 110px; resize: vertical; margin: 6px 0; font-size: 12px; }
  #right .row { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
  #right .row label { display: flex; align-items: center; gap: 4px; color: var(--dim); font-size: 12px; }
  #framenav { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  #framenav .info { flex: 1; text-align: center; color: var(--gold); }
  .hint { color: var(--dim); font-size: 11px; }
  /* 设置弹层 */
  #settings { position: fixed; inset: 0; background: rgba(6,4,14,.7); display: none;
    align-items: center; justify-content: center; z-index: 50; }
  #settings .box { width: 520px; background: var(--panel); border: 2px solid var(--line);
    padding: 18px; border-radius: 6px; }
  #settings .box h3 { margin: 0 0 12px; color: var(--gold); }
  #settings .frow { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  #settings .frow label { width: 96px; flex: none; color: var(--dim); }
  #settings .frow input, #settings .frow select { flex: 1; }
  #settings textarea { width: 100%; height: 84px; margin-top: 4px; font-size: 12px; }
</style>
</head>
<body>
<div id="topbar">
  <b>素材重制工作台</b>
  <button id="btn-export" class="primary">导出素材包</button>
  <button id="btn-import">导入预览</button>
  <button id="btn-apply">应用到本页运行时</button>
  <button id="btn-settings">设置</button>
  <span class="spacer"></span>
  <button id="btn-queue-entry">整条目入队</button>
  <button id="btn-next-todo">下一未完成 (N)</button>
  <span id="queue-status" class="hint">队列空闲</span>
  <span id="global-stats" class="hint"></span>
  <span id="status">初始化…</span>
</div>
<div id="main">
  <div id="left">
    <div id="cats"></div>
    <div class="search"><input id="search" placeholder="搜索名称/key…"><label class="hint"><input type="checkbox" id="only-todo">只看未完成</label></div>
    <div id="list"></div>
    <div class="foot" id="list-foot"></div>
  </div>
  <div id="center">
    <div id="sheetwrap"><div class="inner">
      <canvas id="sheetcv"></canvas><canvas id="gridov"></canvas>
    </div></div>
    <div id="filmstrip"></div>
    <div id="animbar" style="display:none;flex:none;align-items:center;gap:8px;padding:4px 8px;background:var(--panel);border-top:1px solid var(--line)">
      <button id="btn-anim" style="padding:3px 10px">▶ 动画预览</button>
      <canvas id="animcv" width="64" height="64" style="width:64px;height:64px;image-rendering:pixelated;border:1px solid var(--line);background:repeating-conic-gradient(#221a38 0% 25%,#1a1428 0% 50%) 0 0/16px 16px"></canvas>
      <span class="hint">重制帧优先 · 每 120ms/帧</span>
    </div>
  </div>
  <div id="right">
    <h3 id="frame-title">选择素材</h3>
    <div class="meta" id="frame-meta"></div>
    <div id="compare">
      <div class="cell"><canvas id="origcv"></canvas><div class="lb">原帧</div></div>
      <div class="cell"><canvas id="newcv"></canvas><div class="lb">重制帧</div></div>
    </div>
    <img id="genpreview" alt="生成原图">
    <div id="candidates" class="row" style="display:none"></div>
    <div class="row"><label><input type="checkbox" id="whole-mode"> 整图重制(整张表一个单元,逐元素原位)</label></div>
    <div class="row"><label><input type="checkbox" id="overlay" checked> 50% 叠加对比</label>
      <label><input type="checkbox" id="use-ref" checked> 相邻已验收帧作风格锚</label></div>
    <textarea id="prompt" placeholder="微调指令(可留空=纯默认模板;输入即追加在默认模板之后,如:更鲜艳、金属质感、暗黑风)"></textarea>
    <div class="row" style="justify-content:flex-end"><button id="btn-apply-prompt" style="font-size:11px;padding:3px 8px">微调→整条目</button></div>
    <div class="hint" id="prompt-preview" style="margin:-2px 0 6px;max-height:52px;overflow-y:auto;white-space:normal"></div>
    <div class="row">
      <button id="btn-remaster" class="primary">入队此帧 (R)</button>
      <button id="btn-remaster-hi">高质重出 (H)</button>
      <button id="btn-accept" class="good">验收 ✓ (A)</button>
      <button id="btn-reject">拒绝</button>
      <button id="btn-skip">跳过 (S)</button>
    </div>
    <div id="framenav">
      <button id="btn-prev">← 上一帧</button>
      <span class="info" id="frame-info"></span>
      <button id="btn-next">下一帧 →</button>
    </div>
    <div class="hint">
      快捷键:←/→ 切帧 · R 重制 · A 验收 · S 跳过。全部帧 验收/跳过 后贴图完成(列表打勾)。
      导出 = 已验收帧像素 + 其余原版像素(混合 sheet);跳过 = 保留原版像素的合法终态。
    </div>
  </div>
</div>
<div id="settings"><div class="box">
  <h3>设置</h3>
  <div class="frow"><label>代理地址</label><input id="set-proxy" placeholder="http://127.0.0.1:5210"></div>
  <div class="frow"><label>OpenAI Key</label><input id="set-key" type="password" placeholder="sk-…(仅存本机 localStorage)"></div>
  <div class="frow"><label>质量档</label><select id="set-quality"><option>low</option><option selected>medium</option><option>high</option></select></div>
  <div class="frow"><label>缩回算法</label><select id="set-algo"><option value="box" selected>box(块平均)</option><option value="nearest">nearest(块中心)</option></select></div>
  <div class="frow" style="align-items:flex-start"><label>全局前缀</label>
    <textarea id="set-prefix"></textarea></div>
  <div class="row" style="justify-content:flex-end">
    <span class="hint" id="proxy-health" style="flex:1"></span>
    <button id="set-close" class="primary">关闭</button>
  </div>
</div></div>
<script type="module">
// 三栏工作台:左=素材目录(AssetCatalog 六类聚合)/ 中=sheet 切帧网格 / 右=单帧重制面板。
// dev-only 工具页(tree-inspect.html 同模式):直接 import 游戏 TS 模块,切帧逻辑与
// 渲染侧单一真源(SpriteAtlas 元数据 / NpcGridLayouts / ITEM_ANIMATION)。
import { SpriteAtlas, ITEM_ANIMATION } from '/src/assets/SpriteAtlas.ts';
import { buildCatalog } from '/src/remaster/AssetCatalog.ts';
import { NPC_GRIDS } from '/src/remaster/NpcGridLayouts.ts';
import { extractFramePixels, frameHash, boxDownscale, computeGenLayout } from '/src/remaster/FrameOps.ts';
import { remasterFrame, pingProxy } from '/src/remaster/ImageRemaster.ts';
import { composePrompt, DEFAULT_GLOBAL_PREFIX } from '/src/remaster/PromptTemplates.ts';
import { WorkbenchState } from '/src/remaster/WorkbenchState.ts';
import { getFramePixels, putFramePixels, loadPromptEdits, savePromptEdits } from '/src/remaster/PackStore.ts';
import { buildManifest, makePack, readPack } from '/src/remaster/PackFormat.ts';
import { RemasterRuntime } from '/src/remaster/RemasterRuntime.ts';
import { assetVersion } from '/src/net/AssetCache.ts';

const $ = (id) => document.getElementById(id);
const setStatus = (s) => { $('status').textContent = s; };
const fetchJson = (p) => fetch(p).then((r) => r.json());

// ---- 目录(json 运行时 fetch:public html 的裸 URL import 不进 vite 模块图,
//      .json 会被当静态资源返回 JSON MIME → 模块加载失败;fetch 通道无此限制) ----
const [vanillaJson, vanillaNpcsJson, vanillaUiJson, index, projFramesJson] = await Promise.all([
  fetchJson('sprites/vanilla.json'),
  fetchJson('sprites/vanilla-npcs.json'),
  fetchJson('sprites/vanilla-ui.json'),
  fetchJson('sprites/remaster-index.json'),
  fetchJson('src/data/vanilla-projframes.json'),
]);
const sizes = { ...index.vanilla, ...index['vanilla-ui'] };
const catalog = buildCatalog({
  vanilla: vanillaJson,
  npcData: vanillaNpcsJson,
  projFrames: projFramesJson,
  uiFiles: vanillaUiJson.files,
  sizes,
  itemAnim: ITEM_ANIMATION,
  npcGrid: NPC_GRIDS,
});

// ---- 运行时(应用到本页预览/探针用;游戏页走 main.ts 装配的同一 Runtime) ----
const atlas = new SpriteAtlas();
const runtime = new RemasterRuntime(atlas);
const state = new WorkbenchState();

// ---- 设置(localStorage) ----
const SETTINGS_KEY = 'sw.remaster.settings';
const settings = Object.assign(
  { proxy: 'http://127.0.0.1:5210', key: '', quality: 'medium', finalizeQuality: 'high', concurrency: 4, algo: 'box', prefix: DEFAULT_GLOBAL_PREFIX },
  JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'));
function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

// ---- 状态 ----
let curCat = 'npc';
let curEntry = null;      // AssetEntry
let curFrame = 0;
let sheetImg = null;      // HTMLImageElement(当前条目 sheet)
// prompt 微调:IndexedDB 通道(★不走 localStorage——微调随条目无界增长,
// 5MB 全局上限迟早撑爆;PackStore.loadPromptEdits/savePromptEdits 异步读写)
const promptEdits = new Map();   // 'entryKey|idx' → 用户微调(增量);启动块异步填充
let promptEditsSaveTimer = 0;
function schedulePromptEditsSave() {
  clearTimeout(promptEditsSaveTimer);
  promptEditsSaveTimer = setTimeout(() => {
    void savePromptEdits([...promptEdits]);
  }, 500);
}
/** 候选存储:key → { list: Uint8ClampedArray[](≤4), sel }。重试不覆盖旧候选
 *  (N 选 1);IDB 只持久化选中候选。bridge.framePixelsMem 兼容别名。 */
const framePixelsMem = new Map();   // 候选存储(见 candPut)
const FRAME_MEM_BUDGET = 64 * 1024 * 1024;   // LRU 预算(whole 16.8MB/张兼容小帧)
let frameMemBytes = 0;
function candBytesOf(c) { return c.list.reduce((n, px) => n + px.length, 0); }
function candPut(key, px) {
  let c = framePixelsMem.get(key);
  if (!c) { c = { list: [], sel: 0 }; framePixelsMem.set(key, c); }
  c.list.push(px);
  if (c.list.length > 4) { frameMemBytes -= c.list[0].length; c.list.shift(); }
  c.sel = c.list.length - 1;   // 新候选默认选中
  frameMemBytes += px.length;
  while (frameMemBytes > FRAME_MEM_BUDGET && framePixelsMem.size > 1) {
    const oldest = framePixelsMem.keys().next().value;
    frameMemBytes -= candBytesOf(framePixelsMem.get(oldest));
    framePixelsMem.delete(oldest);
  }
}
function candSel(key) { return framePixelsMem.get(key)?.list[framePixelsMem.get(key).sel] ?? null; }
function candSelectIdx(key, i) {
  const c = framePixelsMem.get(key);
  if (c && i >= 0 && i < c.list.length) c.sel = i;
}
function memTrackDelete(key) {
  const v = framePixelsMem.get(key);
  if (v) { frameMemBytes -= candBytesOf(v); framePixelsMem.delete(key); }
}
const remastering = new Set();    // 防重入
let lastGen = null;       // {b64, layout}
let onlyTodo = false;
/** 整图重制模式(true=整张 sheet 一个重制单元;excluded 条目强制开)。 */
let wholeMode = false;
/** 单帧整图条目(ui/gore/glow/buff/misc 普通条目):frames[0] 即整图——
 *  whole 模式与逐帧模式重制单元【相同】,共享记录键 0(否则同图两键重复重制、
 *  进度分母虚增 1/2、导出两份像素并存)。 */
function isSingleWholeFrameEntry() {
  if (!curEntry || !sheetImg || curEntry.frames.length !== 1) return false;
  const f = curEntry.frames[0];
  return f.x === 0 && f.y === 0 && f.w === sheetImg.width && f.h === sheetImg.height;
}
/** 当前生效帧(whole 模式=整图帧;单帧整图条目直用 frames[0]) */
function effectiveFrame() {
  if (!curEntry || !sheetImg) return null;
  if (wholeMode) {
    if (isSingleWholeFrameEntry()) return { ...curEntry.frames[0] };
    return { x: 0, y: 0, w: sheetImg.width, h: sheetImg.height, frameIdx: -1 };
  }
  return curEntry.frames[curFrame] ?? null;
}
/** 当前记录帧号(whole=-1 哨兵与逐帧区分;单帧整图条目=0) */
function curFrameIdx() {
  if (!wholeMode) return curFrame;
  return isSingleWholeFrameEntry() ? 0 : -1;
}

// ---- 左栏:类别 + 列表 ----
const CATS = [['npc', 'NPC'], ['tile', '物块'], ['wall', '墙'], ['item', '物品'], ['projectile', '弹幕'],
  ['ui', 'UI'], ['gore', '碎块'], ['glow', '辉光'], ['buff', 'Buff'], ['misc', '杂项']];
for (const [id, label] of CATS) {
  const b = document.createElement('button');
  b.textContent = label; b.dataset.cat = id;
  b.onclick = () => { curCat = id; renderCats(); renderList(); };
  $('cats').appendChild(b);
}
function renderCats() {
  for (const b of $('cats').children) b.classList.toggle('on', b.dataset.cat === curCat);
}
function renderList() {
  const q = $('search').value.trim().toLowerCase();
  const all = catalog.byCategory.get(curCat) ?? [];
  const list = all.filter((e) => {
    if (onlyTodo && state.progress[e.key]?.complete) return false;
    if (q && !e.name.toLowerCase().includes(q) && !e.key.toLowerCase().includes(q)) return false;
    return true;
  });
  const PAGE = 400;
  const frag = document.createDocumentFragment();
  for (const e of list.slice(0, PAGE)) {
    const div = document.createElement('div');
    div.className = 'item' + (e === curEntry ? ' sel' : '') + (e.meta?.excluded ? ' excl' : '');
    const p = state.progressText(e);
    const done = state.progress[e.key]?.complete;
    div.innerHTML = `<span class="nm" title="${e.key} · ${e.sheet}${e.meta?.excluded ? ' · 整图:' + e.meta.excluded : ''}">${e.name}</span><span class="pg${done ? ' done' : ''}">${e.meta?.excluded ? `整图 ${p}` : p}</span>`;
    div.onclick = () => selectEntry(e);
    frag.appendChild(div);
  }
  const el = $('list');
  el.replaceChildren(frag);
  $('list-foot').textContent = `${list.length} 条${list.length > PAGE ? `(仅显示前 ${PAGE},请搜索)` : ''} · 完成 ${all.filter((e) => state.progress[e.key]?.complete).length}/${all.length}`;
}
$('search').oninput = () => renderList();
$('only-todo').onchange = (e) => { onlyTodo = e.target.checked; renderList(); };
state.onChange = () => { renderList(); renderGlobalStats(); };

// ---- 中栏:sheet 网格 + 帧胶片 ----
/** sheet 加载缓存(LRU ~12 张:大 atlas 解码位图 ~16MB/张,防队列跨条目反复重解码) */
const sheetCache = new Map();
function loadSheet(file) {
  const hit = sheetCache.get(file);
  if (hit) { sheetCache.delete(file); sheetCache.set(file, hit); return Promise.resolve(hit); }   // LRU 触顶
  return new Promise((resolve) => {
    const im = new Image();
    im.onload = () => {
      sheetCache.set(file, im);
      while (sheetCache.size > 12) sheetCache.delete(sheetCache.keys().next().value);
      resolve(im);
    };
    im.onerror = () => resolve(null);
    im.src = 'sprites/' + encodeURI(file);
  });
}
function selectEntry(e) {
  curEntry = e;
  curFrame = 0;
  wholeMode = wholeModeFor(e);   // tile/wall 类默认整图(B:单元 ×7 缩减);excluded/无帧同
  $('whole-mode').checked = wholeMode;
  $('whole-mode').disabled = e.frames.length === 0;          // 无帧可逐:只能整图
  lastGen = null;
  renderList();
  void (async () => {
    sheetImg = await loadSheet(e.sheet);
    drawSheet();
    renderFilm();
    renderFrame();
  })();
}
function frameStatus(idx) {
  if (!curEntry) return 'untouched';
  return state.frame(curEntry, idx).status;
}
function frameColor(st) {
  return { untouched: '#55506a', pending: '#5a9cf0', accepted: '#4ad07a', skipped: '#e0c050', failed: '#e07070' }[st] ?? '#55506a';
}
function drawSheet() {
  const cv = $('sheetcv'), ov = $('gridov');
  if (!sheetImg || !curEntry) { cv.width = cv.height = 10; return; }
  const z = sheetImg.width > 1400 ? 1 : sheetImg.width > 700 ? 2 : 4;
  cv.width = sheetImg.width; cv.height = sheetImg.height;
  cv.style.width = (sheetImg.width * z) + 'px'; cv.style.height = (sheetImg.height * z) + 'px';
  const cx = cv.getContext('2d');
  cx.imageSmoothingEnabled = false;
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.drawImage(sheetImg, 0, 0);
  // 帧高亮与状态着色(覆盖层,同尺度绘制)
  ov.width = sheetImg.width; ov.height = sheetImg.height;
  ov.style.width = cv.style.width; ov.style.height = cv.style.height;
  const ox = ov.getContext('2d');
  ox.clearRect(0, 0, ov.width, ov.height);
  const drawFrames = wholeMode ? [effectiveFrame()].filter(Boolean) : curEntry.frames;
  for (const f of drawFrames) {
    const st = frameStatus(f.frameIdx);
    ox.strokeStyle = frameColor(st);
    ox.globalAlpha = 1;
    ox.lineWidth = 2;
    ox.strokeRect(f.x + .5, f.y + .5, f.w - 1, f.h - 1);
    if (!wholeMode && f.frameIdx === curFrame) {
      ox.globalAlpha = .18; ox.fillStyle = '#ffd76e';
      ox.fillRect(f.x, f.y, f.w, f.h);
    }
  }
  ox.globalAlpha = 1;
  // 点击选帧
  ov.style.pointerEvents = 'none';
  cv.style.cursor = 'pointer';
  cv.onclick = (ev) => {
    if (!curEntry) return;
    const r = cv.getBoundingClientRect();
    const px = (ev.clientX - r.left) / z, py = (ev.clientY - r.top) / z;
    let best = null, bd = 1e9;
    for (const f of curEntry.frames) {
      if (px >= f.x && px < f.x + f.w && py >= f.y && py < f.y + f.h) { best = f; break; }
      const d = Math.hypot(px - (f.x + f.w / 2), py - (f.y + f.h / 2));
      if (d < bd) { bd = d; best = f; }

function applyOverlay(px) {

  // 漂移(此前只给 newcv 设 CSS opacity,露出的是背景格子而非原帧,对比语义不成立)

    if ($('overlay').checked) {
      cx.drawImage(sheetImg, f.x, f.y, f.w, f.h, 0, 0, f.w, f.h);   // 原帧打底
      // putImageData 不吃 globalAlpha——重制帧经临时 canvas 以 50% alpha 叠上
      const t = document.createElement('canvas');

      if (!tc) return;
      tc.putImageData(new ImageData(new Uint8ClampedArray(px), f.w, f.h), 0, 0);
      cx.globalAlpha = 0.5;
      cx.drawImage(t, 0, 0);

}

// ---- 重制 ----
/** 单元寻址辅助(脱离 curEntry 语境:队列可对任意条目执行)。 */
function unitRectOf(entry, frameIdx, img) {
  if (frameIdx === -1) return { x: 0, y: 0, w: img.width, h: img.height };
  return entry.frames[frameIdx] ?? null;
}
function unitIsWhole(entry, frameIdx) {
  if (frameIdx !== -1) return false;
  // 单帧整图条目在入队时已解析为 0;到这里的 -1 必是显式 whole 单元
  return true;
}
/** 单元微调键(promptEdits 寻址,与交互路径 memKey 同构)。 */
function unitKeyOf(entry, frameIdx) { return `${entry.key}|${frameIdx}`; }

/** 执行核:重制任意条目的任意单元(队列 worker 与交互路径共用)。
 *  qualityOverride = 定稿档(C 两阶段);prompt 组装用当前微调(等待中改词即生效)。 */
async function runUnit(entry, frameIdx, qualityOverride) {
  const key = unitKeyOf(entry, frameIdx);
  if (remastering.has(key)) return;
  remastering.add(key);
  const quality = qualityOverride ?? settings.quality;
  try {
    const img = await loadSheet(entry.sheet);
    if (!img) throw new Error(`sheet 加载失败:${entry.sheet}`);
    const f = unitRectOf(entry, frameIdx, img);
    if (!f) throw new Error(`帧 ${frameIdx} 越界`);
    const isWhole = unitIsWhole(entry, frameIdx);
    const orig = extractFramePixels(img, f);
    // 风格锚:仅逐帧模式(整图单元无"相邻帧"语义;锚=当前条目最近已验收帧)
    let refFrame;
    let refIdx;
    if (!isWhole) {
      refIdx = findRefFrameFor(entry, frameIdx);
      if (refIdx !== undefined) {
        const refPx = await pixelsOfKey(entry, refIdx);
        if (refPx) {
          const rf = entry.frames[refIdx];
          refFrame = { pixels: refPx, w: rf.w, h: rf.h, frameIdx: refIdx };
        }
      }
    }
    const full = composePrompt({
      category: entry.category, name: entry.name,
      frameIdx: Math.max(0, frameIdx), frameCount: entry.frames.length,
      globalPrefix: settings.prefix,
      refFrameIdx: refIdx,
      userPrompt: promptEdits.get(key),
      whole: isWhole,
    });
    const t0 = performance.now();
    const result = await remasterFrame({
      frame: orig.data, w: f.w, h: f.h,
      prompt: full,
      quality,
      refFrame,
      proxyUrl: settings.proxy,
      apiKey: settings.key || undefined,
      algo: settings.algo,
      whole: isWhole,
    });
    apiCalls++; apiCostEst += QUALITY_COST[quality] ?? 0.04;
    candPut(key, result.pixels);
    await state.remastered(entry, frameIdx, full, quality,
      { size: [result.layout.W, result.layout.H], algo: settings.algo, refFrame: refIdx }, result.pixels);
    // 当前正在看的单元:展示生成原图与耗时
    if (curEntry === entry && curFrameIdx() === frameIdx) {
      lastGen = result;
      const gp = $('genpreview');
      gp.src = 'data:image/png;base64,' + result.genPng;
      gp.style.display = 'block';
      setStatus(`重制完成 ${((performance.now() - t0) / 1000).toFixed(1)}s · ${(result.elapsedMs / 1000).toFixed(1)}s(API ${quality})`);
    }
  } catch (err) {
    console.error('[remaster]', entry.key, frameIdx, err);
    if (curEntry === entry) setStatus(`重制失败(${entry.name} #${frameIdx}):${err.message}`);
  } finally {
    remastering.delete(key);
    drawSheet(); renderFilm(); renderFrame(); queueUI();
  }
}

/** 风格锚查找(条目参数化:curEntry 语境之外可用)。 */
function findRefFrameFor(entry, frameIdx) {
  if (!$('use-ref').checked) return undefined;
  for (const d of [1, 2, 3]) {
    for (const i of [frameIdx - d, frameIdx + d]) {
      if (i >= 0 && i < entry.frames.length && state.frame(entry, i).status === 'accepted') return i;
    }
  }
  return undefined;
}
async function pixelsOfKey(entry, idx) {
  const k = unitKeyOf(entry, idx);
  return candSel(k) ?? (await getFramePixels(entry.key, idx)) ?? null;
}

// ── 队列+并发预取(人工只验收不等待;验收闸门保留——生成完只置 pending) ──
const remasterQueue = [];    // Array<{entry, frameIdx, quality?}>
let activeJobs = 0;
/** API 计量(成本估算,medium≈$0.04/low≈$0.01/high≈$0.08 量级) */
let apiCalls = 0, apiCostEst = 0;
const QUALITY_COST = { low: 0.01, medium: 0.04, high: 0.08 };
function enqueue(entry, frameIdx, quality) {
  remasterQueue.push({ entry, frameIdx, quality });
  pump();
}
/** 条目全部非终态单元入队(whole 模式=整图单元;否则逐帧)。 */
function enqueueEntry(entry) {
  const p = state.progress[entry.key];
  const done = (i) => { const st = p?.frames[i]?.status; return st === 'accepted' || st === 'skipped'; };
  const useWhole = entry === curEntry ? wholeMode : wholeModeFor(entry);
  if (useWhole) {
    if (!done(-1) && !remastering.has(unitKeyOf(entry, -1))) enqueue(entry, -1);
  } else {
    for (let i = 0; i < entry.frames.length; i++) {
      if (!done(i) && !remastering.has(unitKeyOf(entry, i))) enqueue(entry, i);
    }
  }
  pump();
}
function pump() {
  while (activeJobs < Math.max(1, settings.concurrency | 0) && remasterQueue.length) {
    const job = remasterQueue.shift();
    activeJobs++;
    void runUnit(job.entry, job.frameIdx, job.quality).finally(() => { activeJobs--; pump(); });
  }
  queueUI();
}
function queueUI() {
  const el = $('queue-status');
  if (el) el.textContent = remasterQueue.length || activeJobs
    ? `队列:${activeJobs} 生成中 / ${remasterQueue.length} 排队` : '队列空闲';
}
/** 交互入口:入队当前单元(quality=定稿档时走 C 两阶段)。★队列语义:
 *  入队即返回不阻塞——并发槽后台生成,人工继续切帧/验收;生成完只置
 *  pending,验收闸门仍是人工 A/S。 */
async function doRemaster(quality) {
  if (!curEntry || !curRect()) return;
  if (remastering.has(memKey())) return;
  enqueue(curEntry, curFrameIdx(), quality);
  setStatus(quality ? `已入队(${quality} 档)` : '已入队,后台生成中…');
  queueUI();
}
/** 条目的默认重制模式(B:tile/wall 类默认整图)。 */
function wholeModeFor(entry) {
  return entry.category === 'tile' || entry.category === 'wall'
    || !!entry.meta?.excluded || entry.frames.length === 0;
}
async function pixelsOf(idx) { return pixelsOfKey(curEntry, idx); }
$('btn-remaster').onclick = () => void doRemaster();
$('btn-remaster-hi').onclick = () => void doRemaster(settings.finalizeQuality);
$('btn-queue-entry').onclick = () => { if (curEntry) { enqueueEntry(curEntry); setStatus(`已入队:${curEntry.name} 全部未完成单元`); } };
/** F:跳到下一个有非终态单元的素材(catalog 序循环)。 */
function gotoNextTodo() {
  const list = catalog.entries;
  const start = curEntry ? list.indexOf(curEntry) + 1 : 0;
  for (let n = 0; n < list.length; n++) {
    const e = list[(start + n) % list.length];
    const p = state.progress[e.key];
    const hasTodo = (p?.frames[-1] !== undefined && p.frames[-1].status !== 'accepted' && p.frames[-1].status !== 'skipped')
      || e.frames.some((f) => { const st = p?.frames[f.frameIdx]?.status; return st !== 'accepted' && st !== 'skipped'; });
    if (hasTodo) { selectEntry(e); setStatus(`→ ${e.name}`); return e; }
  }
  setStatus('全部素材已完成!');
  return null;
}
$('btn-next-todo').onclick = () => gotoNextTodo();
$('btn-apply-prompt').onclick = () => applyPromptToEntry();

// ---- 导出素材包 ----
async function exportPack() {
  setStatus('导出中(合成混合 sheet)…');
  try {
    const sheets = [];
    const entriesMeta = {};
    const bySheet = new Map();
    for (const [key, p] of Object.entries(state.progress)) {
      const e = catalog.byKey.get(key);
      // frames 空(无法逐帧)但存在整图记录(-1)的条目也要导出
      if (!e || (!e.frames.length && !p.frames[-1])) continue;
      let arr = bySheet.get(e.sheet);
      if (!arr) { arr = []; bySheet.set(e.sheet, arr); }
      arr.push(e);
    }
    let sheetNo = 0;
    for (const [sheet, ents] of bySheet) {
      setStatus(`导出中(合成混合 sheet)… ${++sheetNo}/${bySheet.size}`);
      const img = await loadSheet(sheet);
      if (!img) { console.warn(`[export] 缺原版 sheet ${sheet},跳过其条目`); continue; }
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const cx = c.getContext('2d', { willReadFrequently: true });
      cx.imageSmoothingEnabled = false;
      cx.drawImage(img, 0, 0);
      const meta = { category: ents[0].category, complete: true, frames: {} };
      for (const e of ents) {
        const p = state.progress[e.key];
        if (!p) continue;
        // 整图重制记录(WHOLE_FRAME_IDX=-1):整图替换(整 sheet putImageData)
        const wholeRec = p.frames[-1];
        if (wholeRec && wholeRec.status !== 'untouched') {
          if (wholeRec.status === 'accepted') {
            const px = framePixelsMem.get(`${e.key}|-1`) ?? (await getFramePixels(e.key, -1));
            if (px) {
              cx.putImageData(new ImageData(new Uint8ClampedArray(px), img.width, img.height), 0, 0);
              meta.frames[`${e.key}#-1`] = { status: 'accepted', rect: [0, 0, img.width, img.height], hash: frameHash(extractFramePixels(img, { x: 0, y: 0, w: img.width, h: img.height, frameIdx: 0 }).data), prompt: wholeRec.prompt, gen: wholeRec.gen };
            } else meta.complete = false;
          } else if (wholeRec.status === 'skipped') {
            meta.frames[`${e.key}#-1`] = { status: 'skipped', rect: [0, 0, img.width, img.height], hash: '' };
          } else meta.complete = false;   // pending 不导出
        }
        for (const f of e.frames) {
          const rec = p.frames[f.frameIdx];
          if (!rec || rec.status === 'untouched') { meta.complete = false; continue; }
          const origHash = frameHash(extractFramePixels(img, f).data);
          if (rec.status === 'accepted') {
            const px = framePixelsMem.get(`${e.key}|${f.frameIdx}`) ?? (await getFramePixels(e.key, f.frameIdx));
            if (!px) { meta.complete = false; continue; }
            cx.putImageData(new ImageData(new Uint8ClampedArray(px), f.w, f.h), f.x, f.y);
            meta.frames[`${e.key}#${f.frameIdx}`] = { status: 'accepted', rect: [f.x, f.y, f.w, f.h], hash: origHash, prompt: rec.prompt, gen: rec.gen };
          } else if (rec.status === 'skipped') {
            meta.frames[`${e.key}#${f.frameIdx}`] = { status: 'skipped', rect: [f.x, f.y, f.w, f.h], hash: origHash };
          } else {
            meta.complete = false;  // pending 不导出
          }
        }
      }
      const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
      sheets.push({ file: sheet, png: new Uint8Array(await blob.arrayBuffer()) });
      entriesMeta[sheet] = meta;
    }
    if (!sheets.length) { setStatus('没有可导出的内容(先验收/跳过一些帧)'); return; }
    const manifest = buildManifest('Terraria Assets Remastered', assetVersion(), entriesMeta);
    const zip = makePack(manifest, sheets);
    const url = URL.createObjectURL(new Blob([zip], { type: 'application/zip' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'terraria-remaster-pack.zip';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10_000);
    const n = Object.values(entriesMeta).reduce((s, m) => s + Object.keys(m.frames).length, 0);
    setStatus(`已导出:${sheets.length} 张 sheet / ${n} 帧 → ${a.download}`);
  } catch (err) {
    setStatus(`导出失败:${err.message}`);
    console.error('[export]', err);
  }
}
$('btn-export').onclick = () => void exportPack();

// ---- 导入预览(peek,不安装;游戏内安装走 RemasterPanel) ----
$('btn-import').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.zip';
  inp.onchange = async () => {
    if (!inp.files?.length) return;
    try {
      const pack = await readPack(new Uint8Array(await inp.files[0].arrayBuffer()));
      const n = Object.keys(pack.manifest.entries).length;
      const frames = Object.values(pack.manifest.entries)
        .reduce((s, e) => s + Object.keys(e.frames).length, 0);
      const apply = confirm(`素材包「${pack.manifest.name}」\n${n} 张 sheet / ${frames} 帧\n应用到本页运行时?`);
      if (apply) {
        const r = await runtime.apply(pack);
        setStatus(`已应用:${r.applied.length} 张(失败 ${r.failed.length})`);
      }
    } catch (err) {
      alert(`导入失败:${err.message}`);
    }
  };
  inp.click();
};

// ---- 应用到本页运行时(当前进度即改即看;探针/下游断言 vimages) ----
$('btn-apply').onclick = async () => {
  if (!curEntry) return;
  setStatus('合成并应用当前条目…');
  // 快速路径:把当前条目的 accepted/pending 帧合成单 sheet pack 应用
  const img = sheetImg;
  if (!img) return;
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.imageSmoothingEnabled = false;
  cx.drawImage(img, 0, 0);
  const framesMeta = {};
  let any = false;
  for (const f of curEntry.frames) {
    const px = framePixelsMem.get(`${curEntry.key}|${f.frameIdx}`);
    if (!px) continue;
    cx.putImageData(new ImageData(new Uint8ClampedArray(px), f.w, f.h), f.x, f.y);
    framesMeta[f.frameIdx] = { status: 'accepted', rect: [f.x, f.y, f.w, f.h], hash: '' };
    any = true;
  }
  if (!any) { setStatus('当前条目无重制帧'); return; }
  const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
  const manifest = buildManifest('工作台预览', assetVersion(),
    { [curEntry.sheet]: { category: curEntry.category, complete: false, frames: framesMeta } });
  const zip = makePack(manifest, [{ file: curEntry.sheet, png: new Uint8Array(await blob.arrayBuffer()) }]);
  const pack = await readPack(zip);
  const r = await runtime.apply(pack);
  setStatus(`本页运行时已应用:${r.applied.join(', ')}`);
};

// ---- 设置 ----
$('btn-settings').onclick = async () => {
  $('set-proxy').value = settings.proxy;
  $('set-key').value = settings.key;
  $('set-quality').value = settings.quality;
  $('set-fq').value = settings.finalizeQuality;
  $('set-conc').value = String(settings.concurrency);
  $('set-algo').value = settings.algo;
  $('set-prefix').value = settings.prefix;
  $('settings').style.display = 'flex';
  const ok = await pingProxy(settings.proxy);
  $('proxy-health').textContent = ok
    ? `代理在线(${settings.proxy})`
    : `代理未响应 —— 启动:cd game && npm run remaster-proxy`;
  $('proxy-health').style.color = ok ? 'var(--st-accepted)' : 'var(--st-skipped)';
};
$('set-close').onclick = () => {
  settings.proxy = $('set-proxy').value.trim() || 'http://127.0.0.1:5210';
  settings.key = $('set-key').value.trim();
  settings.quality = $('set-quality').value;
  settings.finalizeQuality = $('set-fq').value;
  settings.concurrency = Number($('set-conc').value) || 4;
  settings.algo = $('set-algo').value;
  settings.prefix = $('set-prefix').value;
  saveSettings();
  $('settings').style.display = 'none';
  renderFrame();
};

// ---- E:动画预览(重制帧优先轮播;多帧条目显示) ----
let animTimer = 0, animIdx = 0;
function updateAnimbar() {
  $('animbar').style.display = (!wholeMode && curEntry && curEntry.frames.length > 1 && sheetImg) ? 'flex' : 'none';
}
function animTick() {
  if (!curEntry || !sheetImg) return;
  const f = curEntry.frames[animIdx % curEntry.frames.length];
  const px = candSel(`${curEntry.key}|${f.frameIdx}`);
  const cv = $('animcv');
  cv.width = f.w; cv.height = f.h;
  const cx = cv.getContext('2d');
  cx.imageSmoothingEnabled = false;
  if (px) cx.putImageData(new ImageData(new Uint8ClampedArray(px), f.w, f.h), 0, 0);
  else cx.drawImage(sheetImg, f.x, f.y, f.w, f.h, 0, 0, f.w, f.h);
  animIdx++;
}
$('btn-anim').onclick = () => {
  if (animTimer) { clearInterval(animTimer); animTimer = 0; $('btn-anim').textContent = '▶ 动画预览'; }
  else { animIdx = 0; animTick(); animTimer = setInterval(animTick, 120); $('btn-anim').textContent = '⏸ 停止'; }
};

// ---- F:全局统计(单元完成/累计调用/成本估算;onChange 刷新) ----
const TOTAL_UNITS = catalog.entries.reduce((n, e) => n + e.frames.length, 0);
function renderGlobalStats() {
  let done = 0;
  for (const e of catalog.entries) {
    const p = state.progress[e.key];
    if (!p) continue;
    for (const f of e.frames) {
      const st = p.frames[f.frameIdx]?.status;
      if (st === 'accepted' || st === 'skipped') done++;
    }
    const w = p.frames[-1];
    if (w && (w.status === 'accepted' || w.status === 'skipped')) done++;
  }
  $('global-stats').textContent = `进度 ${done}/${TOTAL_UNITS} 单元 · API ${apiCalls} 次 ≈$${apiCostEst.toFixed(2)}`;
}
// 微调条目级继承:当前微调应用到该条目全部单元
function applyPromptToEntry() {
  if (!curEntry) return;
  const val = $('prompt').value;
  const idxs = wholeMode ? [-1] : curEntry.frames.map((f) => f.frameIdx);
  for (const i of idxs) promptEdits.set(unitKeyOf(curEntry, i), val);
  schedulePromptEditsSave();
  setStatus(`微调已应用到 ${curEntry.name} 全部 ${idxs.length} 个单元`);
}

// ---- 快捷键 ----
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') $('btn-prev').click();
  else if (e.key === 'ArrowRight') $('btn-next').click();
  else if (e.key === 'r' || e.key === 'R') $('btn-remaster').click();
  else if (e.key === 'h' || e.key === 'H') $('btn-remaster-hi').click();
  else if (e.key === 'a' || e.key === 'A') $('btn-accept').click();
  else if (e.key === 's' || e.key === 'S') $('btn-skip').click();
  else if (e.key === 'n' || e.key === 'N') $('btn-next-todo').click();
});

// ---- 探针桥 ----
window.__remasterBridge = {
  catalog, state, runtime, atlas, settings,
  exportPack, selectEntry, curEntry: () => curEntry, curFrame: () => curFrame,
  curFrameIdx: () => curFrameIdx(), wholeMode: () => wholeMode, wholeModeFor,
  enqueue, enqueueEntry, gotoNextTodo, queue: remasterQueue,
  remaster: async (quality) => {   // 入队 + 等完成(探针同步语义)
    const key = memKey();
    await doRemaster(quality);
    const t0 = Date.now();
    while (remastering.has(key) && Date.now() - t0 < 30_000) {
      await new Promise((r) => setTimeout(r, 150));
    }
  },
  accept: doAccept, skip: doSkip,
  framePixelsMem, promptEdits, apiStats: () => ({ calls: apiCalls, cost: apiCostEst }),
};

// ---- 启动 ----
void (async () => {
  await state.load();
  for (const [k, v] of await loadPromptEdits()) promptEdits.set(k, v);
  renderCats();
  renderList();
  // 默认选第一个 NPC(蓝史莱姆,小而全流程)
  const first = catalog.byKey.get('npc:1');
  if (first) selectEntry(first);
  setStatus(`就绪:${catalog.entries.length} 条素材(vanilla ${Object.keys(index.vanilla).length} + ui ${Object.keys(index['vanilla-ui']).length} 张图)`);
})();
</script>
