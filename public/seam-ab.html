<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>动态物件缝 A/B 对照(在你的浏览器打开)</title>
<style>
  body { background: #222; color: #ddd; font: 13px/1.5 monospace; margin: 16px; }
  canvas { image-rendering: pixelated; display: block; margin: 6px 0; border: 1px solid #555; }
  h3 { margin: 14px 0 4px; color: #ffd27f; }
  .note { color: #9ab; max-width: 980px; }
</style>
</head>
<body>
<h2>动态物件缝 A/B 对照</h2>
<p class="note">上行 = 按原版规则从原始图集逐带合成的机器(每格 src=带,dest=格+2 tileTop,×1.25 最近邻)。
下行 = 同一合成但把三行格画进【同一 256 画布】再整块 ×1.25(模拟 chunk 页路径)。
在你看到缝的同一浏览器里对比:若合成图也有线 → 采样问题;若干净 → 游戏管线问题。</p>
<script>
(async () => {
  const SHEETS = [
    { file: '/sprites/vanilla/Tiles_220.png', fw: 3, fh: 3 },   // 固化机 3×3
    { file: '/sprites/vanilla/Tiles_228.png', fw: 3, fh: 3 },   // 染料缸 3×3(缝最明显)
    { file: '/sprites/vanilla/Tiles_306.png', fw: 3, fh: 3 },   // 冰机 3×3(缝最明显)
    { file: '/sprites/vanilla/Tiles_218.png', fw: 3, fh: 2 },   // 绞肉机 3×2
    { file: '/sprites/vanilla/Tiles_227.png', fw: 1, fh: 1 },   // 染料植物 1×1
  ];
  // 固化机 220: 3列×3行? 实为 2×3? 以 png 高/18=12 带、3带/台 = 4 帧;
  // 用户的三台 = 216(220)固化机 2×3 / 227 / 228 —— 均按 fw×fh 从 png 推:
  async function loadImg(p) {
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = p; });
  }
  const Z = 1.25, TS = 16, PITCH = 18, TTOP = 2;
  // ===== A. 逐格合成(与动态层一致:格 r 的 src=[fy+PITCH*r, +16], dest=[r*TS+TTOP, +16]) =====
  const composePerCell = (img, fw, fh, frameIdx) => {
    const c = document.createElement('canvas');
    c.width = Math.ceil(fw * TS * Z) + 4; c.height = Math.ceil((fh * TS + TTOP) * Z) + 4;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    for (let r = 0; r < fh; r++) {
      for (let cc = 0; cc < fw; cc++) {
        const sx = cc * PITCH, sy = frameIdx * (PITCH * fh) + r * PITCH;
        // 每格单独 translate+scale(dev 包装同款:dest 边界 round 共享)
        const dxa = Math.round(cc * TS * Z), dxb = Math.round((cc + 1) * TS * Z);
        const yda = Math.round((r * TS + TTOP) * Z), ydb = Math.round(((r + 1) * TS + TTOP) * Z);
        x.save();
        x.translate(dxa, yda);
        x.scale((dxb - dxa) / TS, (ydb - yda) / TS);
        x.translate(-cc * TS, -r * TS);
        x.drawImage(img, sx, sy, TS, TS, cc * TS, r * TS, TS, TS);
        x.restore();
      }
    }
    return c;
  };
  // ===== B. 整块画布再缩放(chunk 页路径:先 1:1 画到 256 画布,再整块 ×1.25) =====
  const composeBaked = (img, fw, fh, frameIdx) => {
    const tile = document.createElement('canvas');
    tile.width = fw * TS + 8; tile.height = fh * TS + 8;
    const t = tile.getContext('2d');
    t.imageSmoothingEnabled = false;
    for (let r = 0; r < fh; r++) for (let cc = 0; cc < fw; cc++) {
      const sx = cc * PITCH, sy = frameIdx * (PITCH * fh) + r * PITCH;
      t.drawImage(img, sx, sy, TS, TS, cc * TS + 4, r * TS + TTOP + 4, TS, TS);
    }
    const c = document.createElement('canvas');
    c.width = Math.ceil(tile.width * Z); c.height = Math.ceil(tile.height * Z);
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    x.drawImage(tile, 0, 0, tile.width, tile.height, 0, 0, c.width, c.height);
    return c;
  };
  let row = document.createElement('div');
  for (const [i, s] of SHEETS.entries()) {
    const img = await loadImg(s.file);
    const frames = Math.floor(img.height / (PITCH * s.fh));
    document.body.appendChild(Object.assign(document.createElement('div'), { textContent: `sheet ${s.file} (${s.fw}×${s.fh}) 共${frames}帧 — 每帧一组[逐格A | 整块B]` }));
    for (let frameIdx = 0; frameIdx < frames; frameIdx++) {
      const a = composePerCell(img, s.fw, s.fh, frameIdx);
      const b = composeBaked(img, s.fw, s.fh, frameIdx);
      const wrap = document.createElement('div');
      wrap.style.display = 'flex'; wrap.style.gap = '14px'; wrap.style.alignItems = 'flex-end';
      const lab = (t) => { const d = document.createElement('div'); d.textContent = t; d.style.color = '#9ab'; d.style.writingMode = 'vertical-rl'; return d; };
      const wA = lab('逐格A'), wB = lab('整块B'), wF = lab('帧' + frameIdx);
      wA.appendChild(a); wB.appendChild(b);
      wrap.appendChild(wF); wrap.appendChild(wA); wrap.appendChild(wB);
      document.body.appendChild(wrap);
    }
  }
  // C. 原始 sheet 参考
  for (const s of SHEETS) {
    const img = await loadImg(s.file);
    const c = document.createElement('canvas');
    c.width = img.width; c.height = Math.min(img.height, 220);
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0);
    document.body.appendChild(Object.assign(document.createElement('div'), { textContent: `C. ${s.file}` }));
    document.body.appendChild(c);
  }
})();
</script>
</body>
</html>
